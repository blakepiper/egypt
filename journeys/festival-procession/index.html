    <div id="root"><noscript><article class="no-script-fallback" aria-labelledby="no-script-journey-title"><p class="kicker">Text-only route</p><h1 id="no-script-journey-title">Festival procession</h1><p>If the sanctuary was closed, when and how did most people meet a god?</p><p class="muted">Thebes: Karnak, Luxor, and the west bank · New Kingdom, principally Dynasty 18 to 20</p><h2>The whole journey as text</h2><p>A route list with five stops from Karnak to Luxor and across to the west bank, each naming who could be present and what they could see.</p><ol><li><h3>Leaving the sanctuary</h3><p class="muted">Karnak · Stage 1 · Day 1 · thebes</p><p>The portable bark carrying the shrine is lifted onto priests' shoulders. The image stays veiled. What the public sees is a covered shrine in motion, which is enough: presence has left the restricted space and entered shared space.</p><ul><li>Bark shrines and way stations along the route are built for exactly this.</li></ul><p><strong>Sources:</strong> <a href="../../archive/sources/?catalog=archive#c03">C03</a></p></li><li><h3>Opet</h3><p class="muted">Karnak to Luxor · Stage 2 · Day 2 · thebes</p><p>Amun, Mut, and Khonsu travel between Karnak and Luxor by processional bark. The rites renew the king's divine potency and the land's fertility. Crowds line the route with music, feasting, and petition.</p><ul><li>Reliefs preserve the musicians, soldiers, boats, and offerings.</li><li>The deepest rites at Luxor are not recoverable from these scenes.</li></ul><p><strong>Sources:</strong> <a href="../../archive/sources/?catalog=archive#c03">C03</a>, <a href="../../archive/sources/?catalog=archive#c02">C02</a></p></li><li><h3>Petition and oracle</h3><p class="muted">Along the route · Stage 3 · Day 3 · deir-el-medina</p><p>A question could be put to the god as the bark passed, and the answer read from its movement. The surviving questions are ordinary: a disputed tomb, a stolen tool, whether a person was responsible. At Deir el-Medina the record is detailed enough to follow individual cases.</p><ul><li>This is a legal procedure as much as a devotional one.</li><li>It puts divine decision inside village disputes, not above them.</li></ul><p><strong>Sources:</strong> <a href="../../archive/sources/?catalog=archive#c03">C03</a></p></li><li><h3>The Beautiful Festival of the Valley</h3><p class="muted">Karnak to the west bank · Stage 4 · Day 4 · thebes</p><p>Amun crosses the river to visit royal mortuary temples on the west bank. Families feast at tomb chapels, so the necropolis becomes a place of reunion for one day rather than only of separation.</p><ul><li>Divine, royal, and family dead are linked by a single route.</li><li>This is one of the clearest cases of state festival and household practice in the same event.</li></ul><p><strong>Sources:</strong> <a href="../../archive/sources/?catalog=archive#c03">C03</a></p></li><li><h3>Return</h3><p class="muted">Back inside · Stage 5 · Day 5 · thebes</p><p>The bark returns and the shrine is closed again. Access narrows back to normal. The festival did not make the sanctuary public; it moved a controlled presence outward for a fixed time and then withdrew it.</p><ul><li>The calendar of festivals is therefore also a calendar of access.</li></ul><p><strong>Sources:</strong> <a href="../../archive/sources/?catalog=archive#c03">C03</a></p></li></ol><p><a href="../../journeys/">See all journeys</a></p></article></noscript></div>
