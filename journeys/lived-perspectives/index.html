    <div id="root"><noscript><article class="no-script-fallback" aria-labelledby="no-script-journey-title"><p class="kicker">Text-only route</p><h1 id="no-script-journey-title">Lived perspectives</h1><p>Whose experience does the surviving record actually let us describe?</p><p class="muted">Thebes and its west bank · New Kingdom, Dynasties 18 to 20, unless a scene says otherwise</p><h2>The whole journey as text</h2><p>Four role descriptions in text, each with period, place, evidence base, and an explicit list of what the sources do not preserve.</p><ol><li><h3>A tomb artisan at Deir el-Medina</h3><p class="muted">Role — documented in detail · Stage 1 · Day 1 · deir-el-medina</p><p>He spends eight days of a ten-day work cycle cutting and painting a royal tomb, and sleeps at the work site between shifts. His household keeps images of protective deities. When a tool goes missing he can put the question to the god's bark on a festival day and get a decision the village will accept.</p><ul><li>Evidence: village letters, ostraca, oracle records, votive stelae, and the excavated settlement.</li><li>Not preserved: what he believed privately, and how much of the practice was habit rather than conviction.</li></ul><p><strong>Sources:</strong> <a href="../../archive/sources/?catalog=archive#c03">C03</a></p></li><li><h3>A part-time hem-netjer</h3><p class="muted">Role — documented by function · Stage 2 · Day 2 · thebes</p><p>He serves a rotation, then returns to other work. During service he shaves, washes, wears linen, and observes restrictions on food and sexual activity. At dawn he opens the shrine and follows a prescribed sequence. Part of the offering returns to him as income.</p><ul><li>Evidence: Sauneron on priestly organisation, temple scenes, and administrative records.</li><li>Not preserved: whether he experienced the daily service as encounter, as duty, or as employment.</li></ul><p><strong>Sources:</strong> <a href="../../archive/sources/?catalog=archive#c22">C22</a>, <a href="../../archive/sources/?catalog=archive#c03">C03</a></p></li><li><h3>A cultivator in the valley</h3><p class="muted">Role — documented indirectly · Stage 3 · Day 3 · thebes</p><p>Her year runs on the river. During inundation there is no field work and labour goes elsewhere. She meets state religion at festivals, at the assessment of the harvest, and at the point where a temple estate takes its share. Most of what she did religiously happened at home and left almost nothing behind.</p><ul><li>Evidence: administrative and temple records, festival reliefs, and household finds from settlements.</li><li>Not preserved: nearly all of ordinary domestic practice, which was made of perishable things.</li></ul><p><strong>Sources:</strong> <a href="../../archive/sources/?catalog=archive#c03">C03</a>, <a href="../../archive/sources/?catalog=archive#c02">C02</a></p></li><li><h3>A family at a funeral</h3><p class="muted">Situation — documented by ritual and by tomb · Stage 4 · Day 4 · thebes</p><p>The body has been in the embalming place for weeks. At the tomb, the coffin is stood upright and the Opening of the Mouth restores the senses. Afterwards the family eats at the chapel. They will return because the offering cult continues long after the funeral.</p><ul><li>Evidence: tomb scenes, funerary equipment, offering formulae, and later letters to the dead.</li><li>Not preserved: grief itself. The record shows what was done, not what it felt like.</li></ul><p><strong>Sources:</strong> <a href="../../archive/sources/?catalog=archive#c03">C03</a>, <a href="../../archive/sources/?catalog=archive#c02">C02</a></p></li></ol><p><a href="../../journeys/">See all journeys</a></p></article></noscript></div>
