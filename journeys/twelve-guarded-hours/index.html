    <div id="root"><noscript><article class="no-script-fallback" aria-labelledby="no-script-journey-title"><p class="kicker">Text-only route</p><h1 id="no-script-journey-title">Twelve guarded hours</h1><p>What kind of knowledge does an Underworld Book claim to give, and to whom?</p><p class="muted">Royal tombs, Valley of the Kings · New Kingdom, Dynasties 18 to 20</p><h2>The whole journey as text</h2><p>Twelve numbered stages in a table, each with the composition it belongs to, what guards it, and what changes.</p><ol><li><h3>Hour 1 — entering the west</h3><p class="muted">Both compositions · Stage 1 · Day 1</p><p>Re passes the western horizon and the bark enters a different order of space. The living world's rules stop applying at this line.</p><ul><li>The tomb itself is built to be this environment.</li></ul><p><strong>Sources:</strong> <a href="../../archive/sources/?catalog=archive#c14">C14</a>, <a href="../../archive/sources/?catalog=archive#c15">C15</a></p></li><li><h3>Hours 2 and 3 — the watery regions</h3><p class="muted">Amduat · Stage 2 · Day 2</p><p>Wide waters and fields. The bark travels in a middle register with populations above and below: gods, blessed dead, and the inert.</p><ul><li>The register layout is the argument. Position on the page is position in the cosmos.</li></ul><p><strong>Sources:</strong> <a href="../../archive/sources/?catalog=archive#c14">C14</a></p></li><li><h3>Hours 4 and 5 — the difficult ground</h3><p class="muted">Amduat · Stage 3 · Day 3</p><p>The route becomes sand, caves, and closed passages. The bark has to be dragged. Sokar's region belongs here, deep underground and associated with regeneration in darkness.</p><ul><li>Movement stops being automatic and becomes work.</li></ul><p><strong>Sources:</strong> <a href="../../archive/sources/?catalog=archive#c14">C14</a></p></li><li><h3>Hour 6 — the union</h3><p class="muted">Amduat · Stage 4 · Day 4</p><p>The solar ba unites with the Osirian body at the deepest point of the night. This is the turning point of the whole composition.</p><ul><li>Mobility and preserved body meet. Neither achieves renewal alone.</li></ul><p><strong>Sources:</strong> <a href="../../archive/sources/?catalog=archive#c14">C14</a></p></li><li><h3>Hours 7 to 9 — Apep</h3><p class="muted">Both compositions · Stage 5 · Day 5</p><p>The serpent is bound, cut, and turned back. Enemies are restrained and, in the Book of Gates, punished with fire. Non-order is handled, not abolished.</p><ul><li>The same operation will be needed tomorrow night.</li></ul><p><strong>Sources:</strong> <a href="../../archive/sources/?catalog=archive#c14">C14</a>, <a href="../../archive/sources/?catalog=archive#c15">C15</a></p></li><li><h3>The gates</h3><p class="muted">Book of Gates · Stage 6 · Day 6</p><p>Great serpents and gate-lines divide the route repeatedly. Named keepers guard each transition, so every threshold becomes a problem of knowledge and authorisation rather than of strength.</p><ul><li>Knowing the name is the pass.</li><li>This is why the composition is written on the walls of the tomb of someone who will need to make the journey.</li></ul><p><strong>Sources:</strong> <a href="../../archive/sources/?catalog=archive#c15">C15</a></p></li><li><h3>The hall of Osiris</h3><p class="muted">Book of Gates · Stage 7 · Day 7</p><p>The Book of Gates includes a judgment hall with Osiris enthroned, and a famous scene grouping the peoples known to Egypt. The sun's ordered cosmos extends past Egyptians, described in Egyptian ethnographic categories.</p><ul><li>This scene is regularly quoted out of context. Its frame is the solar circuit, not a statement of equality.</li></ul><p><strong>Sources:</strong> <a href="../../archive/sources/?catalog=archive#c15">C15</a></p></li><li><h3>Hour 12 — emergence</h3><p class="muted">Both compositions · Stage 8 · Day 8</p><p>Beings pass through the body of a great serpent and come out renewed. The sun emerges as Khepri. The Book of Gates closes by composing Nun, Nut, bark, and scarab into a single rebirth image.</p><ul><li>Passing through the serpent is a visual grammar for renewal, not a narrative event to be literalised.</li></ul><p><strong>Sources:</strong> <a href="../../archive/sources/?catalog=archive#c14">C14</a>, <a href="../../archive/sources/?catalog=archive#c15">C15</a></p></li></ol><p><a href="../../journeys/">See all journeys</a></p></article></noscript></div>
