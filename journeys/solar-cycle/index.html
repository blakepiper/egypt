    <div id="root"><noscript><article class="no-script-fallback" aria-labelledby="no-script-journey-title"><p class="kicker">Text-only route</p><h1 id="no-script-journey-title">Solar cycle</h1><p>What happens to the sun between the western horizon and the eastern one, and who says so?</p><p class="muted">Royal tombs in the Valley of the Kings; solar temples and hymns more widely · New Kingdom compositions, drawing on much older solar material</p><h2>The whole journey as text</h2><p>A stepper of six stages with the same content as the animation, listing corpus, actors, and what changes at each stage.</p><ol><li><h3>Khepri at dawn</h3><p class="muted">Form of the sun · Stage 1 · Day 1</p><p>The morning sun is Khepri, the scarab: becoming, transformation, movement that has just started. Naming the sun three times across a day is a claim about process rather than about three separate gods.</p><ul><li>Scarab imagery marks renewal wherever it appears, including on hearts and coffins.</li></ul><p><strong>Sources:</strong> <a href="../../archive/sources/?catalog=archive#c02">C02</a></p></li><li><h3>Re at noon</h3><p class="muted">Form of the sun · Stage 2 · Day 2</p><p>At full height the sun is Re, falcon-headed with the disk: visible power, kingship, and the light that the ordered world runs on.</p><ul><li>Re joins with other gods without displacing them. Amun-Re is the largest example.</li></ul><p><strong>Sources:</strong> <a href="../../archive/sources/?catalog=archive#c02">C02</a></p></li><li><h3>Atum at evening</h3><p class="muted">Form of the sun · Stage 3 · Day 3</p><p>The setting sun is Atum: completion, and the creator who generated the first differentiated beings. Ending the day returns to the figure who started everything.</p><ul><li>This is why sunset is not simply loss.</li></ul><p><strong>Sources:</strong> <a href="../../archive/sources/?catalog=archive#c02">C02</a>, <a href="../../archive/sources/?catalog=archive#c12">C12</a></p></li><li><h3>Entering the west</h3><p class="muted">The crossing begins · Stage 4 · Day 4</p><p>Re enters the Duat in a bark, often ram-headed at night. The route is divided into twelve regions. Names identify beings, places, doors, and the actions each requires; knowing them is what lets the king travel too.</p><ul><li>The Amduat presents a hidden geography with the bark in a middle register.</li><li>The Book of Gates makes each division a guarded gate with a named keeper.</li></ul><p><strong>Sources:</strong> <a href="../../archive/sources/?catalog=archive#c14">C14</a>, <a href="../../archive/sources/?catalog=archive#c15">C15</a></p></li><li><h3>The deep hour</h3><p class="muted">Re and Osiris · Stage 5 · Day 5</p><p>In the middle of the night the solar ba unites with the Osirian body. This is the regenerative centre of the whole system: mobility meets a preserved body, and neither works alone.</p><ul><li>The archive treats this union as the clearest statement of how the two great cycles depend on each other.</li></ul><p><strong>Sources:</strong> <a href="../../archive/sources/?catalog=archive#c14">C14</a></p></li><li><h3>Apep restrained</h3><p class="muted">The recurring threat · Stage 6 · Day 6</p><p>The serpent Apep is bound, cut, or turned back in the later hours. He is not killed permanently. Non-order is restrained again each night, which is exactly the pattern the rest of the archive keeps showing.</p><ul><li>Restraint, not destruction, is the accurate verb.</li></ul><p><strong>Sources:</strong> <a href="../../archive/sources/?catalog=archive#c14">C14</a>, <a href="../../archive/sources/?catalog=archive#c15">C15</a></p></li><li><h3>Emergence</h3><p class="muted">Dawn · Stage 7 · Day 7</p><p>In the final hour beings pass through a great serpent and the renewed sun emerges as Khepri. The Book of Gates ends by composing Nun, Nut, bark, and scarab into one compact image of coming up.</p><ul><li>The cycle closes where it began, which is the definition of the problem it solves.</li></ul><p><strong>Sources:</strong> <a href="../../archive/sources/?catalog=archive#c14">C14</a>, <a href="../../archive/sources/?catalog=archive#c15">C15</a></p></li></ol><p><a href="../../journeys/">See all journeys</a></p></article></noscript></div>
