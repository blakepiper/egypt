    <div id="root"><noscript><article class="no-script-fallback" aria-labelledby="no-script-journey-title"><p class="kicker">Text-only route</p><h1 id="no-script-journey-title">Temple morning</h1><p>What did a priest actually do at dawn, and how far into the building could anyone else go?</p><p class="muted">A large state temple; Karnak is the fullest surviving example · New Kingdom, with elements attested earlier and later</p><h2>The whole journey as text</h2><p>A seven-step ordered list moving inward from the pylon to the sanctuary and back out, with the access limit stated at every step.</p><ol><li><h3>The pylon</h3><p class="muted">Threshold 1 — public · Stage 1 · Day 1</p><p>The gate is built like the horizon sign: two towers with the sun rising between them. Its outer face carries the king striking enemies. This is the most public surface of the building and the most political one.</p><ul><li>Anyone could stand here.</li><li>The imagery addresses the town, not the god.</li></ul><p><strong>Sources:</strong> <a href="../../archive/sources/?catalog=archive#c03">C03</a></p></li><li><h3>The open court</h3><p class="muted">Threshold 2 — limited public · Stage 2 · Day 2</p><p>Light is still full. On festival days the portable bark rested here and crowds could come close to a veiled shrine. On an ordinary morning the court is nearly empty.</p><ul><li>Access was occasional rather than daily.</li><li>Petitioners gathered at margins and side chapels.</li></ul><p><strong>Sources:</strong> <a href="../../archive/sources/?catalog=archive#c03">C03</a>, <a href="../../archive/sources/?catalog=archive#c22">C22</a></p></li><li><h3>The hypostyle hall</h3><p class="muted">Threshold 3 — staff · Stage 3 · Day 3</p><p>Columns stand close together like a marsh at the edge of creation. Ceilings carry sky; bases carry plants. The floor rises and the roof lowers as you go in, so the building narrows toward the first mound.</p><ul><li>Light drops sharply.</li><li>The architecture makes an argument about cosmology.</li></ul><p><strong>Sources:</strong> <a href="../../archive/sources/?catalog=archive#c03">C03</a></p></li><li><h3>Purification</h3><p class="muted">The officiant prepares · Stage 4 · Day 4</p><p>The priest washes, is shaved, and puts on linen. Purity here is fitness to approach rather than moral innocence. Many priestly posts were part-time and rotated, so this was a duty period, not a permanent identity.</p><ul><li>Sauneron is the archive's main source for these requirements.</li><li>Restrictions covered dress, food, and sexual activity during service.</li></ul><p><strong>Sources:</strong> <a href="../../archive/sources/?catalog=archive#c22">C22</a></p></li><li><h3>Breaking the seal</h3><p class="muted">Threshold 4 — the sanctuary · Stage 5 · Day 5</p><p>The clay seal on the shrine doors is broken and the doors are drawn open. The image inside is small. It is not on display and it is not a portrait; ritual has made it a controlled body that divine presence can occupy.</p><ul><li>Prostration, incense, and hymns accompany the awakening.</li><li>The Opening of the Mouth, or a comparable animation, is what makes an image able to see, breathe, eat, and speak.</li></ul><p><strong>Sources:</strong> <a href="../../archive/sources/?catalog=archive#c22">C22</a>, <a href="../../archive/sources/?catalog=archive#c03">C03</a></p></li><li><h3>The service</h3><p class="muted">The repeated core · Stage 6 · Day 6</p><p>Yesterday's clothing and unguents are removed. The image is washed, anointed, dressed, and ornamented. Food, drink, incense, and a figure of Maat are presented. Presenting maat is not a metaphor here; it is one of the offerings.</p><ul><li>The same verbs — wash, clothe, feed — are used for a god, a king, and a mummy.</li><li>Reliefs show the king performing this because he was the theoretical sole officiant. Priests acted as his deputies.</li></ul><p><strong>Sources:</strong> <a href="../../archive/sources/?catalog=archive#c22">C22</a>, <a href="../../archive/sources/?catalog=archive#c03">C03</a></p></li><li><h3>Withdrawal</h3><p class="muted">Closing and reversion · Stage 7 · Day 7</p><p>The doors are closed and resealed and the priest backs out, sweeping away his own footprints. The offerings do not disappear. After divine use they revert to priests, staff, and other cults, so the theological meal is also the temple's payroll.</p><ul><li>Reversion of offerings ties cult to economy directly.</li><li>The service will be repeated. That repetition is the point.</li></ul><p><strong>Sources:</strong> <a href="../../archive/sources/?catalog=archive#c22">C22</a>, <a href="../../archive/sources/?catalog=archive#c03">C03</a></p></li></ol><p><a href="../../journeys/">See all journeys</a></p></article></noscript></div>
