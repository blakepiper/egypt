    <div id="root"><noscript><article class="no-script-fallback" aria-labelledby="no-script-journey-title"><p class="kicker">Text-only route</p><h1 id="no-script-journey-title">The Nile year</h1><p>How did the river's year organise labour, institutions, and religious attention?</p><p class="muted">The Nile valley and Delta · Pharaonic Egypt broadly; the pattern is a long-term structure rather than a dated event</p><h2>The whole journey as text</h2><p>Three seasons in order, each with its approximate months, river state, agricultural work, and religious associations, given as text.</p><ol><li><h3>Akhet — inundation</h3><p class="muted">Roughly July to October · Stage 1 · Day 1</p><p>Floodwater covered the fields and left silt behind. Fields could not be worked, so labour moved to repair, transport, construction, and institutional service. Hapi, the personified inundation, is shown heavy-bodied with aquatic plants, binding the Two Lands together.</p><ul><li>A high flood destroyed; a low flood starved. Neither was rare.</li><li>Egyptians associated the water's origin with caverns near the First Cataract.</li></ul><p><strong>Sources:</strong> <a href="../../archive/sources/?catalog=archive#c02">C02</a>, <a href="../../archive/sources/?catalog=archive#c03">C03</a></p></li><li><h3>Peret — emergence</h3><p class="muted">Roughly November to February · Stage 2 · Day 2</p><p>As the water fell, land came back out and was sown. Boundaries had to be re-established, canals maintained, and assessments made. Emergence is also the vocabulary of creation: land appearing out of water is the founding image of the whole system.</p><ul><li>The same word family describes the primeval mound rising from Nun.</li><li>Osiris festivals in this part of the year tie germination to regeneration.</li></ul><p><strong>Sources:</strong> <a href="../../archive/sources/?catalog=archive#c02">C02</a>, <a href="../../archive/sources/?catalog=archive#c03">C03</a></p></li><li><h3>Shemu — harvest and low water</h3><p class="muted">Roughly March to June · Stage 3 · Day 3</p><p>Grain was reaped, threshed, measured, and stored. Measurement is a religious act here as much as an economic one: assessment, taxation, and temple provisioning all run through it. Then the river dropped to its lowest and the year waited.</p><ul><li>Temple estates were provisioned from this cycle.</li><li>The waiting is the point: the flood's return was needed, not guaranteed.</li></ul><p><strong>Sources:</strong> <a href="../../archive/sources/?catalog=archive#c02">C02</a>, <a href="../../archive/sources/?catalog=archive#c03">C03</a></p></li><li><h3>The river's own inhabitants</h3><p class="muted">Sobek and the water · Stage 4 · Day 4</p><p>Sobek is a crocodile in a river that had crocodiles in it. He carries water, fertility, aggression, and royal power at once, and his cult concentrates where the water spreads out — the Fayum marshes and, later, Kom Ombo.</p><ul><li>The Fayum's Middle Kingdom royal patronage is the clearest case of ecology and politics arriving together.</li></ul><p><strong>Sources:</strong> <a href="../../archive/sources/?catalog=archive#c20">C20</a>, <a href="../../archive/sources/?catalog=archive#c02">C02</a></p></li><li><h3>What ended</h3><p class="muted">A modern note · Stage 5 · Day 5</p><p>The annual inundation no longer happens. Dam construction in the twentieth century replaced it with managed release. Anything you can watch on the river today is a modern hydrological system, and this journey is a reconstruction of a vanished one.</p><ul><li>This is stated here so that no image or footage in the archive is mistaken for the ancient cycle.</li></ul><p><strong>Sources:</strong> <a href="../../archive/sources/?catalog=archive#c02">C02</a></p></li></ol><p><a href="../../journeys/">See all journeys</a></p></article></noscript></div>
