name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Content lint
        run: npm run content:check
      - name: Media rights
        run: npm run media:check
      - name: Factual and humanizer review
        run: npm run review:check
      - name: TypeScript
        run: npm run typecheck
      - name: Contrast
        run: npm run check:contrast
      - name: Unit tests
        run: npm run test:unit
      - name: Build at the Pages base path
        run: npm run build
        env:
          # `github.repository` is `owner/name`; Pages serves a project site from /name/.
          BASE_PATH: /${{ github.event.repository.name }}/
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
      - name: Browser, accessibility, and deployment tests
        run: npm run test:e2e
      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
