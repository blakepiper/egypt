    <div id="root"><noscript><main id="main-content" class="page trip"><h1>Itinerary</h1><p>Sydney’s 30th Birthday on the Nile · January 11–15, 2027</p><p>Five days and four nights on a private dahabiya, from Luxor to Aswan.</p><section id="day-2027-01-11" class="trip-day"><h2><time datetime="2027-01-11">Monday, Jan 11</time> · Luxor to Esna</h2><ul><li>Meet at Iberotel Luxor for pickup with luggage, then visit Karnak Temple with the group.</li><li>Drive about an hour from Luxor to Esna.</li><li>Visit the Temple of Esna, the Wekalet Al-Geddawi caravanserai, and Al-Qissariya market.</li><li>Board the dahabiya for lunch and sailing. Dinner aboard.</li></ul><p>The cruise operator lists a visit to El Hegz after embarkation. The timing is to be confirmed with the group’s Karnak visit.</p></section><section id="day-2027-01-12" class="trip-day"><h2><time datetime="2027-01-12">Tuesday, Jan 12</time> · El Kab and Edfu</h2><ul><li>Have breakfast aboard, then explore the walls of ancient Nekheb and the New Kingdom tombs at El Kab.</li><li>Sail to Edfu to visit the Temple of Horus.</li><li>Have dinner aboard.</li></ul></section><section id="day-2027-01-13" class="trip-day"><h2><time datetime="2027-01-13">Wednesday, Jan 13</time> · Bisaw and Gebel el-Silsila</h2><ul><li>Visit Bisaw Island for Nile fishing and traditional sun-bread baking.</li><li>Explore the sandstone quarry and shrines at Gebel el-Silsila.</li><li>Have a barbecue dinner. The day’s catch may be part of the meal.</li></ul></section><section id="day-2027-01-14" class="trip-day"><h2><time datetime="2027-01-14">Thursday, Jan 14</time> · Kom Ombo and Daraw</h2><p><strong>Sydney’s 30th birthday</strong></p><ul><li>Visit the double temple of Sobek and Haroeris at Kom Ombo and see mummified crocodiles at the Crocodile Museum.</li><li>Shop for dinner ingredients at the Daraw market and learn about the camel trade.</li><li>Swim or kayak if you’d like, then have farewell dinner aboard.</li></ul><p>The operator also lists a visit to a Nubian community. Confirm with the group whether it’s on the schedule.</p></section><section id="day-2027-01-15" class="trip-day"><h2><time datetime="2027-01-15">Friday, Jan 15</time> · Aswan to Cairo</h2><ul><li>Have breakfast aboard and check out in Aswan.</li><li>The group plans to take the 12:05 p.m. flight to Cairo.</li></ul><p>Checkout time and airport transfer arrangements are to be confirmed.</p></section><section id="trip-details"><h2>Trip details</h2><h3>Transfers</h3><ul><li>Monday: The group plans to be picked up with luggage at Iberotel Luxor, visit Karnak, then drive to Esna. The pickup time is to be confirmed.</li><li>Friday: Breakfast and checkout in Aswan before the group’s planned 12:05 p.m. flight to Cairo. The airport transfer is to be confirmed.</li></ul><h3>What’s included</h3><ul><li>Four nights in double cabins, meals and drinks aboard, guided cruise stops, and entry fees for included visits.</li><li>Alcohol and optional tours are separate.</li></ul><h3>On board and ashore</h3><ul><li>The operator asks guests to dress conservatively for village visits.</li><li>Swimming and kayaking are optional. Request a kayak at least two days before the cruise.</li><li>The operator may adjust the itinerary if sailing conditions change.</li></ul></section></main></noscript></div>
